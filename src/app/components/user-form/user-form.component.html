<div class="container mt-4">
  <h2>Dodaj użytkownika do sieci (ID: {{ networkId }})</h2>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="firstName" class="form-label">Imię</label>
      <input
        type="text"
        id="firstName"
        class="form-control"
        formControlName="firstName"
        [ngClass]="{ 'is-invalid': userForm.get('firstName')?.invalid && userForm.get('firstName')?.touched }"
      />
      <div
        *ngIf="userForm.get('firstName')?.invalid && userForm.get('firstName')?.touched"
        class="invalid-feedback"
      >
        Imię jest wymagane.
      </div>
    </div>

    <div class="mb-3">
      <label for="lastName" class="form-label">Nazwisko</label>
      <input
        type="text"
        id="lastName"
        class="form-control"
        formControlName="lastName"
        [ngClass]="{ 'is-invalid': userForm.get('lastName')?.invalid && userForm.get('lastName')?.touched }"
      />
      <div
        *ngIf="userForm.get('lastName')?.invalid && userForm.get('lastName')?.touched"
        class="invalid-feedback"
      >
        Nazwisko jest wymagane.
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        id="email"
        class="form-control"
        formControlName="email"
        [ngClass]="{ 'is-invalid': userForm.get('email')?.invalid && userForm.get('email')?.touched }"
      />
      <div
        *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched"
        class="invalid-feedback"
      >
        Podaj poprawny adres email.
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">
      Dodaj użytkownika
    </button>
  </form>
</div>
